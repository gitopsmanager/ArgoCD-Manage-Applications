name: "ArgoCD Manage Applications"
description: "Handles full ArgoCD lifecycle: auth, connect, delete, create, sync, wait-for-sync. Supports no-fail mode for restore cluster runs."

inputs:
  argocd_url:
    description: "Full ArgoCD base URL (e.g. https://aks-prod-weu-argocd-argocd-web-ui.affinity7software.com)"
    required: true
    type: string

  argocd_auth_token:
    required: false
    type: string

  argocd_username:
    required: false
    type: string

  argocd_password:
    required: false
    type: string

  insecure_argo:
    required: false
    default: false
    type: string

  argocd_ca_cert:
    required: false
    type: string

  namespace:
    required: true
    type: string

  cd_repo:
    required: true
    type: string

  cd_path_rel:
    description: "Relative path inside the CD repo where app files were copied (e.g. <cluster>/<namespace>)"
    required: true
    type: string

  cd_repo_org:
    required: true
    type: string

  overlay_dir:
    required: false
    default: ""
    type: string

  apps:
    description: "JSON array of {name, path, images}"
    required: true
    type: string

  list_only:
    description: "When true, just list applications and exit"
    required: false
    default: false
    type: string


  delete_first:
    required: false
    default: false
    type: string

  delete_only:
    required: false
    default: false
    type: string

  skip_status_check:
    required: false
    default: false
    type: string

outputs:
  json_file:
    description: "Path to the ArgoCD applications JSON file written during list_only mode."
    value: "/tmp/argo-apps.json"

 

runs:
  using: composite


  steps:

    - name: Verify delete_only type
      run: |
        echo "delete_only raw  : '${{ inputs.delete_only }}'"
        echo "Expression result: ${{ inputs.delete_only == 'false' }}"
      shell: bash



    - name: Resolve ArgoCD auth
      id: resolve_auth
      shell: bash
      env:
        IN_TOKEN: ${{ inputs.argocd_auth_token }}
        IN_USER: ${{ inputs.argocd_username }}
        IN_PASS: ${{ inputs.argocd_password }}
      run: |
        set -euo pipefail
        if [ -n "${IN_TOKEN:-}" ]; then
          echo "mode=token" >> "$GITHUB_OUTPUT"
          echo "token=$IN_TOKEN" >> "$GITHUB_OUTPUT"
        elif [ -n "${IN_USER:-}" ] && [ -n "${IN_PASS:-}" ]; then
          echo "mode=basic" >> "$GITHUB_OUTPUT"
          echo "username=$IN_USER" >> "$GITHUB_OUTPUT"
          echo "password=$IN_PASS" >> "$GITHUB_OUTPUT"
        elif [ -n "${SEC_USER:-}" ] && [ -n "${SEC_PASS:-}" ]; then
          echo "mode=basic" >> "$GITHUB_OUTPUT"
          echo "username=$SEC_USER" >> "$GITHUB_OUTPUT"
          echo "password=$SEC_PASS" >> "$GITHUB_OUTPUT"
        else
          echo "❌ No ArgoCD auth provided."
          exit 1
        fi

    - name: Debug ARGOCD_CA_CERT presence
      run: |
        if [ -z "${ARGOCD_CA_CERT}" ]; then
          echo "❌ ARGOCD_CA_CERT is not set"
        else
          echo "✅ ARGOCD_CA_CERT is set (length: ${#ARGOCD_CA_CERT})"
        fi
      shell: bash
      env:
        ARGOCD_CA_CERT: ${{ inputs.argocd_ca_cert }}

    - name: Set ArgoCD connection (token & URLs)
      id: argocd_conn
      uses: actions/github-script@v9
      env:
        ARGOCD_URL: ${{ inputs.argocd_url }}
        MODE: ${{ steps.resolve_auth.outputs.mode }}
        TOKEN: ${{ steps.resolve_auth.outputs.token }}
        USERNAME: ${{ steps.resolve_auth.outputs.username }}
        PASSWORD: ${{ steps.resolve_auth.outputs.password }}
        ARGOCD_CA_CERT: ${{ inputs.argocd_ca_cert }}
        CLUSTER: ${{ github.event.inputs.target_cluster || github.event.inputs.cluster }}
        DNS_ZONE: ${{ github.event.inputs.dns_zone }}
        INSECURE_ARGO: ${{ inputs.insecure_argo }}
      with:
        script: |
          const { execSync } = require('child_process');
          const fs = require('fs');
          const argocdUrl = process.env.ARGOCD_URL;
          if (!argocdUrl) {
            core.setFailed("❌ Missing required input: argocd_url");
            return;
          }


          let curlSslFlags = "";
          if (String(process.env.INSECURE_ARGO) === "true") {
            curlSslFlags = "-k";
            core.warning("⚠️ Using insecure connection (curl -k).");
          } else if (process.env.ARGOCD_CA_CERT) {
            let cert = process.env.ARGOCD_CA_CERT;
            if (cert.includes('\\n')) cert = cert.replace(/\\n/g, '\n');
            fs.writeFileSync('/tmp/argocd-ca.crt', cert);
            curlSslFlags = "--cacert /tmp/argocd-ca.crt";
            core.info("✅ Using provided CA cert with curl.");
          }

          let finalToken = process.env.TOKEN;
          if (process.env.MODE !== "token") {
            const body = JSON.stringify({ username: process.env.USERNAME, password: process.env.PASSWORD });
            const cmd = `curl -s ${curlSslFlags} -X POST "${argocdUrl}/api/v1/session" -H "Content-Type: application/json" -d '${body.replace(/'/g,"'\\''")}'`;
            const resp = execSync(cmd).toString();
            try {
              finalToken = JSON.parse(resp).token;
            } catch {
              core.error(`Response: ${resp}`);
              core.setFailed("❌ Failed to parse ArgoCD session response");
              return;
            }
          }
          if (!finalToken) {
            core.setFailed("❌ Failed to obtain ArgoCD token.");
            return;
          }
          core.info("✅ Successfully obtained ArgoCD token.");
          core.setOutput('argocd_url', argocdUrl);
          core.setOutput('curl_ssl_flags', curlSslFlags);
          core.setOutput('token', finalToken);


    - name: List ArgoCD applications (if list_only)
      if: ${{ inputs.list_only == 'true' }}
      id: list_apps
      uses: actions/github-script@v9
      env:
        ARGOCD_URL: ${{ steps.argocd_conn.outputs.argocd_url }}
        ARGOCD_TOKEN: ${{ steps.argocd_conn.outputs.token }}
        CURL_SSL_FLAGS: ${{ steps.argocd_conn.outputs.curl_ssl_flags }}
      with:
        result-encoding: string
        script: |
          const { execSync } = require('child_process');
          const fs = require('fs');
          const url = `${process.env.ARGOCD_URL}/api/v1/applications`;
          const cmd = `curl -s ${process.env.CURL_SSL_FLAGS} -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" "${url}"`;

          const output = execSync(cmd, { encoding: "utf8" });
          fs.writeFileSync("/tmp/argo-apps.json", output, "utf8");

          const bytes = Buffer.byteLength(output, "utf8");
          core.info(`✅ Retrieved ArgoCD apps (~${bytes} bytes)`);
          core.info(`💾 Saved to /tmp/argo-apps.json`);


    - name: Exit after listing (if list_only)
      if: ${{ inputs.list_only == 'true' }}
      run: |
        echo "📋 Listed ArgoCD apps; exiting composite action."
        exit 0
      shell: bash





    - name: Delete ArgoCD apps (per app)
      if: ${{ inputs.delete_first == 'true' || inputs.delete_only == 'true' }}
      uses: actions/github-script@v9
      env:
        APPS: ${{ inputs.apps }}
        ARGOCD_URL: ${{ steps.argocd_conn.outputs.argocd_url }}
        ARGOCD_TOKEN: ${{ steps.argocd_conn.outputs.token }}
        CURL_SSL_FLAGS: ${{ steps.argocd_conn.outputs.curl_ssl_flags }}
        NAMESPACE: ${{ inputs.namespace }}
      with:
        script: |
          const { execSync } = require('child_process');
          const apps = JSON.parse(process.env.APPS || '[]');
          function httpCode(cmd) {
            return parseInt(execSync(`${cmd} -o /dev/null -w "%{http_code}"`).toString().trim(), 10);
          }
          for (const app of apps) {
            const appName = `${process.env.NAMESPACE}-${app.name}`;
            const appUrl = `${process.env.ARGOCD_URL}/api/v1/applications/${appName}`;
            core.info(`🗑️ Deleting ArgoCD Application: ${appName}`);
            const delCmd = `curl -s ${process.env.CURL_SSL_FLAGS} -X DELETE "${appUrl}" -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" -H "Content-Type: application/json"`;
            const code = httpCode(delCmd);
            core.info(`Delete response HTTP ${code}`);
            if (![200,202,204].includes(code)) {
              core.setFailed(`❌ Failed to delete ${appName}: HTTP ${code}`);
              continue;
            }
            const timeout = Date.now() + 120000;
            while (Date.now() < timeout) {
              const checkCmd = `curl -s ${process.env.CURL_SSL_FLAGS} -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" "${appUrl}"`;
              const checkCode = httpCode(checkCmd);
              if (checkCode === 403) {
                core.info(`✅ ${appName} deleted (HTTP 403)`);
                break;
              }
              core.info(`⏳ Still deleting ${appName} (HTTP ${checkCode})...`);
              await new Promise(r => setTimeout(r, 5000));
            }
          }

    - name: Check or create ArgoCD applications (per app)
      uses: actions/github-script@v9
      if: ${{ inputs.delete_only == 'false' }}
      env:
        ACTIONS_STEP_DEBUG: true
        APPS: ${{ inputs.apps }}
        CD_PATH_REL: ${{ inputs.cd_path_rel }} 
        OVERLAY_DIR: ${{ inputs.overlay_dir }}
        CD_REPO: ${{ inputs.cd_repo }}
        CD_REPO_ORG: ${{ inputs.cd_repo_org }}
        ARGOCD_URL: ${{ steps.argocd_conn.outputs.argocd_url }}
        ARGOCD_TOKEN: ${{ steps.argocd_conn.outputs.token }}
        CURL_SSL_FLAGS: ${{ steps.argocd_conn.outputs.curl_ssl_flags }}
        NAMESPACE: ${{ inputs.namespace }}
        TEMPLATE_FILE: ${{ github.action_path }}/templates/argocd-app-template-v7.json
      with:
        script: |
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          // core.info(`GITHUB_ACTION_PATH=${process.env.GITHUB_ACTION_PATH || 'undefined'}`);
          const nunjucks = require(path.join(process.env.GITHUB_ACTION_PATH, 'nunjucks.js'))
          const apps = JSON.parse(process.env.APPS || '[]');

          // === Helper functions (same logic, extra debug) ===
          function curlJson(url) {
            const cmd = `curl -s ${process.env.CURL_SSL_FLAGS} -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" "${url}"`;
            // core.info(`🔎 curlJson executing: ${url} with added bearer`);
            try {
              const result = execSync(cmd).toString();
              // core.info(`📡 curlJson response (first 400 chars): ${result.slice(0,400)}${result.length>400?'…':''}`);
              return result;
            } catch (err) {
              core.warning(`⚠️ curlJson failed for ${url}: ${err.message}`);
              return '';
            }
          }


          function deleteApp(appUrl, appName) {
            return new Promise(async (resolve) => {
              const { execSync } = require('child_process');

              const delCmd = `curl -s -o /dev/null -w "%{http_code}" ${process.env.CURL_SSL_FLAGS} \
                -X DELETE "${appUrl}" -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" \
                -H "Content-Type: application/json"`;

              try {
                core.info(`🗑️ Deleting app ${appName}`);
                execSync(delCmd);
              } catch (err) {
                core.warning(`⚠️ Delete request for ${appName} failed: ${err.message}`);
              }

              const timeout = Date.now() + 120000;
              while (Date.now() < timeout) {
                try {
                  const checkCmd = `curl -s -o /dev/null -w "%{http_code}" ${process.env.CURL_SSL_FLAGS} \
                    -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" "${appUrl}"`;
                  const code = parseInt(execSync(checkCmd).toString());
                  core.info(`⌛ Delete check for ${appName}: HTTP ${code}`);

                  if (code === 403) {
                    core.info(`✅ ${appName} confirmed deleted`);
                    resolve(true);
                    return;
                  }
                } catch (err) {
                  core.warning(`⚠️ Delete check failed for ${appName}: ${err.message}`);
                }

                await new Promise(r => setTimeout(r, 5000));
              }

              core.warning(`⌛ Timed out waiting for ${appName} to delete`);
              resolve(false);
            });
          }



          // === Load template ===
          const templatePath = process.env.TEMPLATE_FILE;

          // core.info(`📂 Loading template: ${templatePath}`);
          const template = fs.readFileSync(templatePath, 'utf8');
          // core.info(`📜 Template content (first 500 chars):\n${template.slice(0,500)}${template.length>500?'…':''}`);

          // === Main processing loop ===
          for (const app of apps) {
            const appName = `${process.env.NAMESPACE}-${app.name}`;
            const statusUrl = `${process.env.ARGOCD_URL}/api/v1/applications/${appName}`;
            const basePath = path.join(process.env.CD_PATH_REL, app.name, 'overlays', process.env.OVERLAY_DIR);

            // core.info(`🔍 Checking status at: ${statusUrl}`);
            core.info(`Processing app ${appName} with 📁 Base path: ${basePath}`);

            const status = curlJson(statusUrl);
            if (status) {
              try {
                const existing = JSON.parse(status);
                // core.info(`📄 Existing app JSON (first 300 chars): ${JSON.stringify(existing).slice(0,300)}${status.length>300?'…':''}`);
                if (existing?.spec?.source?.path !== basePath) {
                  core.warning(`⚠️ Path mismatch for ${appName}, recreating`);
                  deleteApp(statusUrl, appName);
                } else {
                  core.info(`✅ Argo app ${appName} exists with correct path.`);
        
                  continue;
                }
              } catch (err) {
                core.warning(`⚠️ Failed to parse ArgoCD app JSON for ${appName}: ${err.message}`);
              }
            }

            // Render manifest
            const rendered = nunjucks.renderString(template, {
              APP_NAME: appName,
              NAMESPACE: process.env.NAMESPACE,
              CD_REPO: process.env.CD_REPO,
              CD_REPO_ORG: process.env.CD_REPO_ORG,
              CD_PATH: basePath
            });
            // core.info(`🧩 Rendered ArgoCD manifest (first 800 chars):\n${rendered.slice(0,800)}${rendered.length>800?'…':''}`);

            // Create app
            const postCmd = `curl -s ${process.env.CURL_SSL_FLAGS} -X POST "${process.env.ARGOCD_URL}/api/v1/applications" \
              -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '${rendered.replace(/'/g,"'\\''")}' -w "\\n%{http_code}"`;
            core.info(`🚀 Creating app ${appName}`);

            try {
              const output = execSync(postCmd).toString();
              const [responseBody, httpCode] = output.split('\n');
              core.info(`📡 Create response HTTP ${httpCode}`);
              core.info(`📦 Response body (first 500 chars): ${responseBody.slice(0,500)}${responseBody.length>500?'…':''}`);
              core.info(`✅ Created Argo app ${appName}`);
            } catch (err) {
              core.warning(`❌ curl POST failed for ${appName}: ${err.message}`);
            }

            core.endGroup();
          }



    - name: Sync ArgoCD apps (per app)
      id: sync
      if: ${{ inputs.delete_only == 'false' }}
      uses: actions/github-script@v9
      env:
        ACTIONS_STEP_DEBUG: true
        APPS: ${{ inputs.apps }}
        ARGOCD_URL: ${{ steps.argocd_conn.outputs.argocd_url }}
        ARGOCD_TOKEN: ${{ steps.argocd_conn.outputs.token }}
        CURL_SSL_FLAGS: ${{ steps.argocd_conn.outputs.curl_ssl_flags }}
        NAMESPACE: ${{ inputs.namespace }}
      with:
        script: |
          const { execSync } = require('child_process');
          const apps = JSON.parse(process.env.APPS || '[]');
          const baselines = {};
          for (const app of apps) {
            const appName = `${process.env.NAMESPACE}-${app.name}`;
            const statusUrl = `${process.env.ARGOCD_URL}/api/v1/applications/${appName}`;
            let baseline = 0;
            try {
              const status = execSync(`curl -s ${process.env.CURL_SSL_FLAGS} -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" "${statusUrl}"`).toString();
              const json = JSON.parse(status);
              if (json?.status?.operationState?.startedAt)
                baseline = new Date(json.status.operationState.startedAt).getTime();
            } catch {}
            baselines[appName] = baseline;
            try {
              execSync(`curl -s ${process.env.CURL_SSL_FLAGS} -X POST "${statusUrl}/sync" -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" -H "Content-Type: application/json" -d '{"prune":true,"force":true}'`);
              core.info(`🚀 Force-prune sync triggered: ${appName}`);
            } catch (err) {
              core.setFailed(`❌ Failed to sync ${appName}: ${err.message}`);
            }
          }
          core.setOutput('baselines', JSON.stringify(baselines));


    - name: Wait for ArgoCD sync (per app)
      if: ${{ inputs.skip_status_check == 'false' && inputs.delete_only == 'false' }}
      uses: actions/github-script@v9
      env:
        APPS: ${{ inputs.apps }}
        ARGOCD_URL: ${{ steps.argocd_conn.outputs.argocd_url }}
        ARGOCD_TOKEN: ${{ steps.argocd_conn.outputs.token }}
        CURL_SSL_FLAGS: ${{ steps.argocd_conn.outputs.curl_ssl_flags }}
        NAMESPACE: ${{ inputs.namespace }}
        BASELINES: ${{ steps.sync.outputs.baselines }}
      with:
        result-encoding: string
        script: |
          const { execSync } = require("child_process");
          const apps = JSON.parse(process.env.APPS || "[]");
          const baselines = JSON.parse(process.env.BASELINES || "{}");

          const results = {};  // namespace/app → ✅ / ❌

          function allResourcesSynced(json) {
            const results =
              json?.status?.operationState?.syncResult?.resources ||
              json?.status?.operationState?.results ||
              [];
            return (
              Array.isArray(results) &&
              results.length > 0 &&
              results.every(r => r.status === "Synced" || r.hookPhase === "Succeeded")
            );
          }

          for (const app of apps) {
            const appName = `${process.env.NAMESPACE}-${app.name}`;
            const appKey = `${process.env.NAMESPACE}/${app.name}`;
            const statusUrl = `${process.env.ARGOCD_URL}/api/v1/applications/${appName}`;
            const baseline = baselines[appName] || 0;
            core.startGroup(`⏳ Waiting for sync of ${appName}, baseline=${baseline}`);

            let ok = false;
            let lastPhase, lastSync, lastHealth;
            let consecutiveErrors = 0;

            // Recorded, NOT acted on, while the loop is still running.
            // core.setFailed cannot be undone, so calling it from inside a
            // retry loop fails the whole job on a state the next poll may
            // contradict -- which is what happened to a first deploy that was
            // Degraded for one poll and Healthy on the next.
            let failure = null;

            // Diagnosis this loop already had and discarded. The whole
            // Application object is fetched 36 times and only four fields were
            // read from it; status.conditions -- which carries the
            // ComparisonError naming the real cause -- was never looked at.
            // Logged on CHANGE rather than every iteration, so a healthy run
            // reads exactly as it did before.
            let lastConditions = [];
            let lastMessage = "";
            let lastDiagSig = "";
            let rawBodyLogged = false;

            try {
              for (let i = 0; i < 36; i++) {
                try {
                  const status = execSync(
                    `curl -s ${process.env.CURL_SSL_FLAGS} -H "Authorization: Bearer ${process.env.ARGOCD_TOKEN}" "${statusUrl}"`
                  ).toString();
                  const json = JSON.parse(status);

                  const op = json?.status?.operationState;
                  lastPhase = op?.phase;
                  lastSync = json?.status?.sync?.status;
                  lastHealth = json?.status?.health?.status;

                  core.info(
                    `🔄 Iteration ${i + 1}/36 for ${appName}: phase=${lastPhase}, sync=${lastSync}, health=${lastHealth}`
                  );

                  // All three undefined means the response was not an
                  // Application at all. curl -s has no -f and no status-code
                  // capture, so a 401/403/404 body parses as JSON, every field
                  // reads undefined, and the poll below counts as a SUCCESS.
                  // The body says which it was; nothing else in the log does.
                  if (json?.status === undefined && !rawBodyLogged) {
                    rawBodyLogged = true;
                    core.warning(
                      `⚠️ ${appName}: the response carries no status - this may not be an Application. ` +
                      `A 401/403/404 body parses as JSON and reads as an empty status.`
                    );
                    core.info(`   raw response: ${String(status).slice(0, 1000)}`);
                  }

                  // status.conditions is where ArgoCD puts the reason it cannot
                  // proceed -- ComparisonError, InvalidSpecError, and the rest.
                  const conditions = Array.isArray(json?.status?.conditions)
                    ? json.status.conditions : [];
                  lastConditions = conditions;
                  lastMessage = op?.message || "";

                  const diagSig = JSON.stringify([conditions, lastMessage]);
                  if (diagSig !== lastDiagSig) {
                    lastDiagSig = diagSig;
                    for (const c of conditions) {
                      core.warning(
                        `⚠️ ${appName} condition ${c?.type || "Unknown"}: ${c?.message || "(no message)"}`
                      );
                    }
                    if (lastMessage) {
                      core.info(`   operationState.message: ${lastMessage}`);
                    }
                  }

                  consecutiveErrors = 0; // reset if success

                  // Immediate fail conditions.
                  //
                  // break, not throw: a throw here lands in this try's own
                  // catch, which treats any exception as a failed status fetch
                  // -- so it logged "Failed to fetch status ... : stop", reset
                  // nothing, and carried on polling for the full six minutes.
                  if (lastPhase === "Error" || lastSync === "Error" || lastSync === "Failed") {
                    failure = `❌ Sync failed for ${appName} (phase=${lastPhase}, sync=${lastSync})`;
                    break;
                  }

                  const startedAt = op?.startedAt ? new Date(op.startedAt).getTime() : 0;
                  const allSynced = allResourcesSynced(json);

                  if (startedAt > baseline) {
                    // Only once the operation has FINISHED. A Deployment is
                    // Degraded by definition while it rolls out, and a first
                    // deploy is Degraded from creation until its first replica
                    // is ready -- phase=Running says ArgoCD is still working,
                    // so health means nothing yet.
                    if (lastPhase === "Succeeded" && lastHealth === "Degraded") {
                      failure = `❌ ${appName} is Synced but health=Degraded.`;
                      break;
                    }
                    if (lastPhase === "Succeeded" && lastSync === "Synced" && lastHealth === "Healthy") {
                      core.info(`✅ ${appName} synced after baseline and is Healthy.`);
                      ok = true;
                      break;
                    } else if (allSynced && lastHealth === "Healthy") {
                      core.info(`✅ ${appName} has all synced results and is Healthy.`);
                      ok = true;
                      break;
                    } else if (lastSync === "Synced") {
                      core.info(`⏳ ${appName} is Synced but health=${lastHealth} → waiting for Healthy...`);
                    }
                  }

                  if (startedAt <= baseline) {
                    if (lastSync === "Synced" && lastHealth === "Healthy") {
                      core.info(`✅ ${appName} was already Synced and Healthy before baseline.`);
                      ok = true;
                      break;
                    }
                  }
                } catch (err) {
                  consecutiveErrors++;
                  if (consecutiveErrors > 3) {
                    core.setFailed(
                      `❌ Failed to fetch status for ${appName} after ${consecutiveErrors} attempts: ${err.message}`
                    );
                    results[appKey] = "❌";
                    throw new Error("stop");
                  } else {
                    core.warning(
                      `⚠️ Failed to fetch status for ${appName} (attempt ${consecutiveErrors}): ${err.message}`
                    );
                  }
                }
                await new Promise(r => setTimeout(r, 10000));
              }

              // Decided ONCE, from the final state. Everything above only
              // records; nothing fails a run it has not finished watching.
              if (failure || !ok) {
                // The line people actually read when this goes wrong, so the
                // diagnosis is repeated here rather than left 36 iterations up.
                core.setFailed(
                  failure ||
                  `❌ Sync did not complete in time for ${appName} (last phase=${lastPhase}, sync=${lastSync}, health=${lastHealth})`
                );
                if (lastConditions.length) {
                  core.error(`   ${appName} was reporting:`);
                  for (const c of lastConditions) {
                    core.error(`     ${c?.type || "Unknown"}: ${c?.message || "(no message)"}`);
                  }
                } else if (lastPhase === undefined && lastSync === undefined && lastHealth === undefined) {
                  core.error(
                    `   No status was ever read for ${appName}. Check the ArgoCD URL and token: ` +
                    `an unauthorised response parses as JSON and polls as though it succeeded.`
                  );
                } else {
                  core.error(`   ${appName} reported no conditions - it was still reconciling.`);
                }
                if (lastMessage) {
                  core.error(`   last operation message: ${lastMessage}`);
                }
                results[appKey] = "❌";
                core.endGroup();
                // A definite failure stops the remaining apps, as it always
                // has. A timeout does not -- the others may still be fine, and
                // their state is worth reporting.
                if (failure) break;
              } else {
                results[appKey] = "✅";
              }
              core.endGroup();              
            } catch (fatal) {
              if (fatal.message === "stop") {
                break; // stop checking other apps after first fatal error
              }
            }
            finally {
              core.endGroup();
            }            
          }

          // --- Summary Section ---
          const table = [["Namespace/App", "Synced"]];
          for (const [k, v] of Object.entries(results)) table.push([k, v]);
          core.summary
            .addHeading("📊 ArgoCD Sync Summary")
            .addTable(table)
            .write();

          core.info(`📋 Raw results: ${JSON.stringify(results, null, 2)}`);

